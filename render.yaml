# Render deployment for the Coaster backend (Node + Express + node:sqlite).
#
# Netlify hosts the frontend (see netlify.toml); this hosts the API it talks to.
# After the service is live, set VITE_API_BASE_URL in Netlify to the backend URL
# (e.g. https://tandemiq-backend.onrender.com) and redeploy the frontend.
#
# To deploy: in Render, "New +" -> "Blueprint", connect this repo. Render reads this
# file, creates the service and a 1 GB persistent disk, and prompts for the secret
# env vars marked `sync: false` below.
services:
  - type: web
    name: tandemiq-backend
    runtime: node
    rootDir: backend
    plan: starter            # Free instances sleep and cold-start (~30-60s of "lag");
                             # Starter stays warm. Change to `free` to trial at no cost.
    buildCommand: npm install
    # Node sizes its heap from the MACHINE's memory, not the container's, and on a shared instance
    # that is a number far larger than this plan allows — measured at 2,240 MB on a developer laptop.
    # V8 therefore has no reason to collect until long after Render's limit is passed, so the
    # container is killed while V8 still believes it has room. That is what "exceeded its memory
    # limit" means here: not a leak, but a garbage collector that was never told how small the box is.
    #
    # 256 MB leaves headroom for the rest. Reading a PDF's text layer settles at about 250 MB
    # resident on top of a 54 MB baseline, and almost none of that is the JS heap — it is native
    # allocation inside pdfjs, which does not grow across documents but does not come back either.
    #
    # The point is not that this makes the app use less. It is that exceeding the ceiling now fails
    # ONE request with an out-of-memory error the logs will name, instead of restarting the service
    # and taking every other request in flight with it. Raise this with the instance size, together.
    startCommand: node --max-old-space-size=256 server.js
    healthCheckPath: /api/health
    autoDeploy: true
    # Persistent disk so the SQLite file (and its WAL) survive redeploys. Without this,
    # every deploy starts from an empty database.
    disk:
      name: tandemiq-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # SQLite lives on the mounted disk, not the ephemeral app directory.
      - key: DB_PATH
        value: /var/data/pm_review.db
      # Render injects PORT; server.js already reads process.env.PORT.
      # Secrets — entered in the Render dashboard, never committed:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD_HASH        # bcrypt hash of the shared team password
        sync: false
      # Session signing secret — let Render generate a strong random value.
      - key: JWT_SECRET
        generateValue: true
      # Public URL of the Netlify frontend — invitation links are built from it.
      - key: APP_BASE_URL
        sync: false
      # Optional: automatic invitation emails. Invitations work without these — the admin
      # just copies the link and sends it themselves. Use EITHER SMTP (your own mailbox;
      # for Gmail an App Password is required) OR a Resend API key.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Optional: Cloudflare R2 object storage for uploaded files. Leave unset to keep
      # files in the database on the persistent disk above. Set all four to use R2, then
      # run `node scripts/migrate-blobs-to-r2.js` once to move existing files over.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
